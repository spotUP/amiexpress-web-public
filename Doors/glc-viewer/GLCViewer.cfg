;server details
SERVERHOST=scenewall.bbs.io
SERVERPORT=1541
;timeout for connecting to server (seconds)
TIMEOUT=5
;how many times to retry a failed fetch before giving up
RETRIES=5
;temporary working file
TEMPFILE=t:jsondata
;number of lines to display (or AUTO when being used as a door will use the users number of display lines)
LINES=AUTO
;clear the screen before displaying the list
SCREENCLEAR=NO
;choose between 4 styles (1-4) (two different headers and two different footers) (comma seperated list for random choice)
STYLE=1,4,3
;1 centres the name column (padded to 21 characters); 0 leaves it left-justified as the board always has
CENTRENAME=0
;timezone name using windows standard naming
TIMEZONE=GMT Standard Time
;scramble the list into place while the server is asked (NO for a slow line)
ANIMATE=YES
