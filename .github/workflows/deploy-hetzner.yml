  name: Deploy to Hetzner

  on:
    push:
      branches: [main]
      # Documentation does not run on the server, and a deploy recreates
      # the container - which drops every connected session. On 2026-08-26
      # eight deploys went out in 46 minutes, three of them for notes and
      # handoffs, and the user was kicked out of /chat over and over while
      # trying to test. Writing something down should not disconnect
      # everybody.
      #
      # Use workflow_dispatch to deploy deliberately when a docs change
      # does need to go out.
      paths-ignore:
        - 'thoughts/**'
        - '**/*.md'
        - 'docs/**'
        - 'LICENSE'
    workflow_dispatch:
      inputs:
        force:
          description: 'Deploy even if callers are online (they WILL be disconnected)'
          type: boolean
          default: false

  # Serialize deploys. Without this, two pushes in quick succession
  # (e.g. the bbfb57736 + e92037b26 pair on 2026-05-20) both grab the
  # SSH session in parallel — the second hits a `docker compose up`
  # race ("Container name … already in use") and fails. cancel-in-progress
  # is FALSE because aborting a mid-build deploy can leave dangling
  # docker resources on the VPS; queueing is safer.
  concurrency:
    group: deploy-hetzner
    cancel-in-progress: false

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to Hetzner VPS
          uses: appleboy/ssh-action@v1.0.3
          # An Actions token so the HOST can fetch as somebody. See the fetch
          # block below for why an anonymous fetch stopped being reliable.
          env:
            GH_TOKEN: ${{ github.token }}
            # The caller guard's override. It reaches the script as an ENV
            # VAR, deliberately: a `${{ }}` anywhere inside `script:` makes
            # the WHOLE 31 KB block one Actions expression, and the cap is
            # 21 000 characters. 6de2140f3 interpolated it inline and the
            # workflow stopped loading altogether - `Exceeded max expression
            # length 21000`, zero jobs, three pushes that never deployed.
            FORCE_DEPLOY: ${{ github.event.inputs.force }}
          with:
            envs: GH_TOKEN,FORCE_DEPLOY
            host: ${{ secrets.HETZNER_HOST }}
            username: root
            key: ${{ secrets.HETZNER_SSH_KEY }}
            command_timeout: 30m
            script: |
              # THE DEPLOY LIVES IN THE REPOSITORY, not in this file.
              #
              # It used to be 534 lines of shell pasted onto the host from
              # here. When Actions stopped running for this repository on
              # 2026-09-08 (a billing failure), that was the only copy of the
              # caller guard, the .info backup, the health check and the
              # rollback - so the board could not be deployed at all and the
              # fix had to be typed by hand on the box.
              #
              # Now the host runs `deploy/deploy.sh` out of its own checkout,
              # which means the same code deploys whether it is triggered from
              # here, from the host's timer, or by a sysop over SSH. This step
              # is a caller, and nothing more.
              set -euo pipefail
              cd /app/amiexpress
              # The script pulls origin/main itself; this fetch only makes sure
              # the script ABOUT to run is the current one.
              GIT_TERMINAL_PROMPT=0 git fetch --prune origin main || true
              git checkout -- deploy/deploy.sh 2>/dev/null || true
              git show origin/main:deploy/deploy.sh > /tmp/deploy.sh
              chmod +x /tmp/deploy.sh
              FORCE_DEPLOY="${FORCE_DEPLOY:-false}" GH_TOKEN="${GH_TOKEN:-}" /tmp/deploy.sh
