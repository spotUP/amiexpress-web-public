<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3e%3ctext y='.9em' font-size='90'%3e%F0%9F%92%BB%3c/text%3e%3c/svg%3e" />
    <!-- maximum-scale/user-scalable: the PAGE must not zoom. The terminal has
         its own zoom, which is a font size; the browser's scales everything and
         slides the on-screen keyboard off the screen, because it is
         position:fixed and anchored to the layout viewport. iOS ignores these,
         so TerminalPage refuses Safari's gesture events as well. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AmiExpress Web BBS</title>

    <!-- Preload critical BBS fonts to ensure they load before terminal displays -->
    <link rel="preload" href="%BASE_URL%fonts/mOsOul_v1.0.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/PetMe64.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/MicroKnight_v1.0.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/Topaz_a500_v1.0.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      /*
       * THE ROOT BOX, and its height is the whole argument.
       *
       * `100vh` on iOS is the LARGE viewport - the height the page would have
       * if the browser's UI were hidden - so the box is taller than what a
       * caller can actually see, and everything the page puts at the bottom
       * (the prompt, under the on-screen keyboard's reserved strip) hangs off
       * the screen. `100svh` is the SMALL viewport: the height with the
       * browser's UI shown, which is the honest floor and never changes as
       * the bar retracts.
       *
       * `100vh` stays as the fallback for a browser without svh, where the
       * two are the same number anyway.
       *
       * Reported by the sysop with screenshots, 2026-09-14: the board drawing
       * under Safari's address bar with no prompt in sight.
       */
      #terminal {
        width: 100vw;
        height: 100vh;
        height: 100svh;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* BBS-style cursor and selection */
      .xterm .xterm-viewport {
        background: #000 !important;
      }

      /*
       * NO CURSOR RULE HERE. THE THEME OWNS THE CURSOR.
       *
       * This block used to read:
       *
       *     .xterm .xterm-cursor { background-color: #fff !important; color: #000 !important; }
       *
       * from the first commit, "Authentic BBS cursor styling", written before
       * the terminal theme had a cursor colour or blink was configured. An
       * `!important` declaration is the ONE thing in the cascade that beats a
       * running CSS animation - and xterm's DOM renderer blinks the cursor
       * with exactly such an animation - so this painted every cursor solid
       * white and stopped the blink for eleven months, on a board whose theme
       * says the cursor is red.
       *
       * It cost four reports from the sysop and five fixes aimed at focus,
       * the renderer's focus class and the theme, none of which could have
       * changed what he saw: the cascade was decided above all of them. Found
       * only by asking the browser which rules matched the cursor span
       * (2026-09-14). An inline <style> in index.html is invisible to every
       * component test and every grep over src/, which is why the pin for
       * this lives in a test that reads THIS FILE.
       */

      /* Selection styling */
      .xterm .xterm-selection div {
        background-color: rgba(255, 255, 255, 0.3) !important;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
